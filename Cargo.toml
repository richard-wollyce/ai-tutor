[package]
name = "wollyce"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Wollyce AI Tutor desktop prototype with Ulpia retrieval, Socratic method and token metering"

[dependencies]
kb = { path = "crates/kb" }
model-call = { path = "crates/model-call" }
pdf-extract = "0.12.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "wollyce"
path = "src/main.rs"

[lib]
name = "wollyce"
path = "src/lib.rs"
